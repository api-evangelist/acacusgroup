aid: acacusgroup
name: Acacus Group
description: >-
  Acacus Group (Acacus Technologies) is a Dubai-headquartered mobility technology company founded in
  2013 that builds artificial-intelligence and machine-learning software for the transportation and
  airline industries. Its Lynx product family — Lynx, Lynx Pro and Lynx Vision — provides intelligent
  fleet management, optimized dispatch built on mathematical combinatorics, disruption management,
  telematics and vehicle diagnostics, and deep-learning video analytics from in-vehicle cameras
  covering driver fatigue, lane departure, tailgating and passenger counting. Acacus also develops
  autonomous vehicle technology and Peregrine, an optimization solution for airline crew and airport
  operations. It won Best Global Startup at GITEX 2016 in Dubai and signed an MOU with Dubai Police
  for driverless patrol vehicles. Lynx sells as an enterprise SaaS subscription through a demo
  request; Acacus publishes no public developer program or machine-readable API contract.
